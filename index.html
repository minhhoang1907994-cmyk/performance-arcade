<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevLab Arcade</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">DevLab <span>Arcade</span></div>
    <div class="spacer"></div>
    <div class="rank-chip" id="rank-chip"></div>
    <button class="btn ghost" id="theme-toggle" type="button" title="Đổi sáng/tối">◐</button>
  </header>

  <main class="wrap" id="app"></main>

  <!-- ngân hàng nội dung: sửa ở đây để thay bằng case thật của team -->
  <script src="data/bug-hunt.data.js"></script>
  <script src="data/spec-detective.data.js"></script>
  <script src="data/prod-roulette.data.js"></script>
  <script src="data/incident.data.js"></script>

  <!-- các game tự đăng ký vào window.DevLabGames -->
  <script src="js/games/bug-hunt.js"></script>
  <script src="js/games/spec-detective.js"></script>
  <script src="js/games/prod-roulette.js"></script>
  <script src="js/games/incident.js"></script>

  <!-- khung ứng dụng, phải nạp sau cùng -->
  <script src="js/app.js"></script>
</body>
</html>
